<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Patient Case-Taking Platform Architecture Overview">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0F1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A2E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="core-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D5A8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="service-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D4F3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#147A5E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ai-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5D1A4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B2D6B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F7931E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD23F;stop-opacity:1" />
    </linearGradient>
    <filter id="box-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow-orange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FFD23F"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-gradient)"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="url(#accent-gradient)" letter-spacing="2">
    SYSTEM ARCHITECTURE
  </text>
  <line x1="300" y1="42" x2="500" y2="42" stroke="url(#accent-gradient)" stroke-width="2"/>
  
  <!-- USERS LAYER -->
  <g transform="translate(50, 70)">
    <rect width="180" height="120" rx="8" fill="#16213E" filter="url(#box-shadow)" stroke="#2A3A5E" stroke-width="1"/>
    <text x="90" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#FFD23F" letter-spacing="1">USERS</text>
    <g font-family="system-ui, sans-serif" font-size="11" fill="#CCC" text-anchor="middle">
      <text x="90" y="50">👤 Patient / Caregiver</text>
      <text x="90" y="70">👨‍⚕️ Doctor / Nurse</text>
      <text x="90" y="90">🏥 Reception Operator</text>
    </g>
  </g>
  
  <!-- CHANNELS LAYER -->
  <g transform="translate(300, 70)">
    <rect width="220" height="120" rx="8" fill="#16213E" filter="url(#box-shadow)" stroke="#2A3A5E" stroke-width="1"/>
    <text x="110" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#FFD23F" letter-spacing="1">CHANNELS</text>
    <g font-family="system-ui, sans-serif" font-size="11" fill="#CCC" text-anchor="middle">
      <rect x="15" y="40" width="85" height="30" rx="4" fill="#FF6B35" opacity="0.2" stroke="#FF6B35" stroke-width="1"/>
      <text x="57.5" y="60" fill="#FF6B35" font-weight="600">Patient PWA</text>
      <rect x="120" y="40" width="85" height="30" rx="4" fill="#F7931E" opacity="0.2" stroke="#F7931E" stroke-width="1"/>
      <text x="162.5" y="60" fill="#F7931E" font-weight="600">Clinician Web</text>
      <rect x="15" y="80" width="190" height="30" rx="4" fill="#FFD23F" opacity="0.15" stroke="#FFD23F" stroke-width="1"/>
      <text x="110" y="100" fill="#FFD23F" font-weight="600">Assisted Kiosk</text>
    </g>
  </g>
  
  <!-- EDGE LAYER -->
  <g transform="translate(580, 70)">
    <rect width="180" height="120" rx="8" fill="#16213E" filter="url(#box-shadow)" stroke="#2A3A5E" stroke-width="1"/>
    <text x="90" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#FFD23F" letter-spacing="1">EDGE</text>
    <g font-family="system-ui, sans-serif" font-size="11" fill="#CCC" text-anchor="middle">
      <text x="90" y="50">🛡️ WAF + DDoS</text>
      <text x="90" y="70">⚖️ Load Balancer</text>
      <text x="90" y="90">🚪 API Gateway</text>
    </g>
  </g>
  
  <!-- CORE SERVICES -->
  <g transform="translate(50, 220)">
    <rect width="710" height="200" rx="8" fill="#0D1B2A" filter="url(#box-shadow)" stroke="#2A3A5E" stroke-width="1"/>
    <text x="355" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#FFD23F" letter-spacing="1">CORE SERVICES</text>
    
    <!-- Clinical Platform -->
    <g transform="translate(20, 40)">
      <rect width="200" height="140" rx="8" fill="url(#core-gradient)" filter="url(#box-shadow)"/>
      <text x="100" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFF" letter-spacing="0.5">CLINICAL PLATFORM</text>
      <g font-family="system-ui, sans-serif" font-size="9" fill="#E0E0E0" text-anchor="middle">
        <text x="100" y="42">🆔 Patient Identity</text>
        <text x="100" y="58">📋 Consent Management</text>
        <text x="100" y="74">🏥 Encounter Engine</text>
        <text x="100" y="90">📝 Clinical Records</text>
        <text x="100" y="106">📄 Document Registry</text>
        <text x="100" y="122">🔐 Audit Trail</text>
      </g>
    </g>
    
    <!-- Conversation Orchestrator -->
    <g transform="translate(250, 40)">
      <rect width="180" height="140" rx="8" fill="url(#service-gradient)" filter="url(#box-shadow)"/>
      <text x="90" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFF" letter-spacing="0.5">CONVERSATION</text>
      <text x="90" y="34" font-family="system-ui, sans-serif" font-size="9" font-weight="500" text-anchor="middle" fill="#A8D5BA">ORCHESTRATOR</text>
      <g font-family="system-ui, sans-serif" font-size="9" fill="#E0E0E0" text-anchor="middle">
        <text x="90" y="54">🎤 VAD + Lang ID</text>
        <text x="90" y="70">🔄 Workflow Control</text>
        <text x="90" y="86">✅ Safety Validation</text>
        <text x="90" y="102">📊 Provenance Track</text>
        <text x="90" y="118">🗣️ TTS Response</text>
      </g>
    </g>
    
    <!-- AI Model Gateway -->
    <g transform="translate(460, 40)">
      <rect width="180" height="140" rx="8" fill="url(#ai-gradient)" filter="url(#box-shadow)"/>
      <text x="90" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFF" letter-spacing="0.5">AI MODEL</text>
      <text x="90" y="34" font-family="system-ui, sans-serif" font-size="9" font-weight="500" text-anchor="middle" fill="#F5C6E0">GATEWAY</text>
      <g font-family="system-ui, sans-serif" font-size="9" fill="#E0E0E0" text-anchor="middle">
        <text x="90" y="54">🎯 AI4Bharat ASR</text>
        <text x="90" y="70">🧠 vLLM / HiMed 8B</text>
        <text x="90" y="86">🔍 PyTorch Clinical NLP</text>
        <text x="90" y="102">🔒 Gateway Isolation</text>
        <text x="90" y="118">📈 Confidence Score</text>
      </g>
    </g>
    
    <!-- Async Workers -->
    <g transform="translate(670, 40)">
      <rect width="100" height="140" rx="8" fill="#2D1B4E" filter="url(#box-shadow)" stroke="#8B2D6B" stroke-width="1"/>
      <text x="50" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#FFF" letter-spacing="0.5">WORKERS</text>
      <g font-family="system-ui, sans-serif" font-size="8" fill="#D0C0E0" text-anchor="middle">
        <text x="50" y="42">📄 Document</text>
        <text x="50" y="56">📋 Summary</text>
        <text x="50" y="70">🚨 Alert</text>
        <text x="50" y="84">🔔 Notify</text>
        <text x="50" y="98">🏛️ ABDM</text>
      </g>
    </g>
  </g>
  
  <!-- DATA LAYER -->
  <g transform="translate(50, 440)">
    <text x="355" y="-10" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#FFD23F" letter-spacing="1">DATA LAYER</text>
  </g>
  
  <g transform="translate(50, 430)">
    <g font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#FFD23F" text-anchor="middle">
      <text x="50" y="15">🐘 PostgreSQL</text>
      <text x="155" y="15">🍃 MongoDB</text>
      <text x="275" y="15">📦 Object Store</text>
      <text x="390" y="15">🔴 Redis</text>
      <text x="500" y="15">🔍 OpenSearch</text>
      <text x="625" y="15">📋 Audit</text>
    </g>
    <g font-family="system-ui, sans-serif" font-size="8" fill="#888" text-anchor="middle">
      <text x="50" y="30">Clinical Truth</text>
      <text x="155" y="30">Raw AI JSON</text>
      <text x="275" y="30">Docs / Audio</text>
      <text x="390" y="30">Ephemeral</text>
      <text x="500" y="30">Derived Search</text>
      <text x="625" y="30">Tamper-proof</text>
    </g>
  </g>
  
  <!-- EXTERNAL INTEGRATIONS -->
  <g transform="translate(50, 480)">
    <text x="355" y="-10" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#FFD23F" letter-spacing="1">EXTERNAL INTEGRATIONS</text>
  </g>
  
  <g transform="translate(50, 470)">
    <g font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#F7931E">
      <text x="100" y="15">🏛️ ABDM / ABHA</text>
      <text x="280" y="15">🏥 HIS / LIMS / PACS</text>
      <text x="500" y="15">📱 SMS / WhatsApp</text>
    </g>
    <g font-family="system-ui, sans-serif" font-size="8" fill="#888">
      <text x="100" y="30" text-anchor="middle">Identity &amp; Consent</text>
      <text x="280" y="30" text-anchor="middle">Hospital Systems</text>
      <text x="500" y="30" text-anchor="middle">Notifications</text>
    </g>
  </g>
  
  <!-- ARROWS - Simplified flow indicators -->
  <g stroke="url(#accent-gradient)" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0.6">
    <!-- Users to Channels -->
    <path d="M230 110 H300"/>
    <path d="M230 130 H300"/>
    <path d="M230 150 H300"/>
    
    <!-- Channels to Edge -->
    <path d="M520 110 H580"/>
    <path d="M520 130 H580"/>
    <path d="M520 150 H580"/>
    
    <!-- Edge to Core -->
    <path d="M670 130 V190 H250 V240"/>
    
    <!-- Core to Workers (Kafka) -->
    <path d="M720 280 V350 H720" stroke="#FFD23F" stroke-dasharray="5,5" marker-end="none"/>
    <text x="725" y="320" font-family="system-ui, sans-serif" font-size="8" fill="#FFD23F" text-anchor="start">Kafka / Redpanda</text>
    
    <!-- Core to Data -->
    <path d="M150 420 V435" stroke="#FF6B35"/>
    <path d="M270 420 V435" stroke="#FF6B35"/>
    <path d="M350 420 V435" stroke="#FF6B35"/>
    <path d="M430 420 V435" stroke="#FF6B35"/>
    <path d="M510 420 V435" stroke="#FF6B35"/>
  </g>
  
  <!-- Legend -->
  <g transform="translate(580, 380)">
    <rect width="180" height="60" rx="6" fill="#0D1B2A" stroke="#2A3A5E" stroke-width="1"/>
    <text x="90" y="15" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#FFD23F">LEGEND</text>
    <g font-family="system-ui, sans-serif" font-size="8" fill="#AAA">
      <rect x="10" y="22" width="12" height="12" rx="3" fill="url(#core-gradient)"/>
      <text x="30" y="31" dominant-baseline="middle">Clinical Core</text>
      <rect x="10" y="38" width="12" height="12" rx="3" fill="url(#service-gradient)"/>
      <text x="30" y="47" dominant-baseline="middle">Async Services</text>
      <rect x="110" y="22" width="12" height="12" rx="3" fill="url(#ai-gradient)"/>
      <text x="130" y="31" dominant-baseline="middle">AI/ML</text>
      <rect x="110" y="38" width="12" height="12" rx="3" fill="#2D1B4E" stroke="#8B2D6B"/>
      <text x="130" y="47" dominant-baseline="middle">Workers</text>
    </g>
  </g>
</svg>
