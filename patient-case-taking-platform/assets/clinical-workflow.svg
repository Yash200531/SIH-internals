<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Primary Clinical Workflow - Patient Case-Taking Flow">
  <defs>
    <linearGradient id="flow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121220;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="patient-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D4F3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#147A5E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="app-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D5A8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="core-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3D2C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5D4A00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="conv-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5D1A4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B2D6B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ai-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A0D3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7A1A5A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="doctor-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A1A0D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7A2A1A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="record-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A3D2C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A5D4A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F7931E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD23F;stop-opacity:1" />
    </linearGradient>
    <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="pulse" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="flow-arrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M0 0 L12 4 L0 8 Z" fill="#FFD23F"/>
    </marker>
    <marker id="return-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0 0 L10 3.5 L0 7 Z" fill="#8B2D6B"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#flow-bg)"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="url(#accent-gradient)" letter-spacing="2">
    PRIMARY CLINICAL WORKFLOW
  </text>
  <line x1="280" y1="42" x2="520" y2="42" stroke="url(#accent-gradient)" stroke-width="2"/>
  
  <!-- Subtitle -->
  <text x="400" y="58" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#888" letter-spacing="1">
    Voice-First Multilingual Case-Taking with Clinician Supervision
  </text>
  
  <!-- SWIMLANES -->
  <g font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#FFD23F">
    <text x="30" y="105">PATIENT</text>
    <text x="30" y="195">APP</text>
    <text x="30" y="285">CORE</text>
    <text x="30" y="375">CONV</text>
    <text x="30" y="465">AI</text>
  </g>
  
  <!-- Horizontal swimlane separators -->
  <g stroke="#2A3A5E" stroke-width="1" opacity="0.3">
    <line x1="80" y1="130" x2="720" y2="130"/>
    <line x1="80" y1="220" x2="720" y2="220"/>
    <line x1="80" y1="310" x2="720" y2="310"/>
    <line x1="80" y1="400" x2="720" y2="400"/>
  </g>
  
  <!-- NODES - Step 1: Patient speaks -->
  <g transform="translate(100, 70)">
    <rect width="160" height="50" rx="8" fill="url(#patient-gradient)" filter="url(#node-shadow)"/>
    <text x="80" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFF">🎤 SPEAK COMPLAINT</text>
    <text x="80" y="38" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#A8D5BA">Hindi / English / Code-switched</text>
  </g>
  
  <!-- Node 2: App receives -->
  <g transform="translate(280, 160)">
    <rect width="180" height="50" rx="8" fill="url(#app-gradient)" filter="url(#node-shadow)"/>
    <text x="90" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFF">📱 CAPTURE & UPLOAD</text>
    <text x="90" y="38" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#B0D0F0">Audio + Metadata</text>
  </g>
  
  <!-- Node 3: Core starts encounter -->
  <g transform="translate(480, 250)">
    <rect width="200" height="50" rx="8" fill="url(#core-gradient)" filter="url(#node-shadow)"/>
    <text x="100" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFF">🏥 START ENCOUNTER</text>
    <text x="100" y="38" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#F0E0B0">Create Patient Session</text>
  </g>
  
  <!-- Node 4: Conversation Orchestrator -->
  <g transform="translate(480, 340)">
    <rect width="200" height="50" rx="8" fill="url(#conv-gradient)" filter="url(#node-shadow)"/>
    <text x="100" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFF">🔄 STRUCTURED INTERVIEW</text>
    <text x="100" y="38" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#F5C6E0">Workflow State Machine</text>
  </g>
  
  <!-- Node 5: AI Gateway -->
  <g transform="translate(480, 430)">
    <rect width="200" height="50" rx="8" fill="url(#ai-gradient)" filter="url(#node-shadow)"/>
    <text x="100" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFF">🤖 AI PROCESSING</text>
    <text x="100" y="38" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#F5C6E0">ASR → NER → Confidence</text>
  </g>
  
  <!-- RETURN PATH NODES -->
  <!-- Node 6: Conv returns to App -->
  <g transform="translate(280, 340)">
    <rect width="180" height="50" rx="8" fill="url(#app-gradient)" filter="url(#node-shadow)" stroke="#8B2D6B" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="90" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFF">❓ CONFIRM ANSWER</text>
    <text x="90" y="38" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#F5C6E0">Show Interpreted Text</text>
  </g>
  
  <!-- Node 7: Patient corrects/approves -->
  <g transform="translate(100, 250)">
    <rect width="160" height="50" rx="8" fill="url(#patient-gradient)" filter="url(#node-shadow)" stroke="#FFD23F" stroke-width="2"/>
    <text x="80" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFF">✅ CORRECT / APPROVE</text>
    <text x="80" y="38" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#FFD23F">Patient Validation</text>
  </g>
  
  <!-- Node 8: App submits to Core -->
  <g transform="translate(280, 250)">
    <rect width="180" height="50" rx="8" fill="url(#app-gradient)" filter="url(#node-shadow)"/>
    <text x="90" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFF">📤 SUBMIT CONFIRMED</text>
    <text x="90" y="38" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#B0D0F0">Verified Answer</text>
  </g>
  
  <!-- Node 9: Core sends draft to Doctor -->
  <g transform="translate(480, 160)">
    <rect width="200" height="50" rx="8" fill="url(#doctor-gradient)" filter="url(#node-shadow)"/>
    <text x="100" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFF">👨‍⚕️ DRAFT TO DOCTOR</text>
    <text x="100" y="38" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#F0C0B0">Summary + Unresolved Qs</text>
  </g>
  
  <!-- Node 10: Doctor signs -->
  <g transform="translate(680, 160)">
    <rect width="100" height="50" rx="8" fill="url(#doctor-gradient)" filter="url(#node-shadow)" stroke="#FF6B35" stroke-width="2"/>
    <text x="50" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFF">✍️ SIGN</text>
    <text x="50" y="38" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#FF6B35">Clinician Accountable</text>
  </g>
  
  <!-- Node 11: Record produces patient summary -->
  <g transform="translate(480, 70)">
    <rect width="200" height="50" rx="8" fill="url(#record-gradient)" filter="url(#node-shadow)"/>
    <text x="100" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFF">📄 PATIENT SUMMARY</text>
    <text x="100" y="38" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#A8D5BA">Multilingual + TTS</text>
  </g>
  
  <!-- Node 12: Patient receives -->
  <g transform="translate(100, 70)">
    <rect width="160" height="50" rx="8" fill="url(#patient-gradient)" filter="url(#node-shadow)" stroke="#147A5E" stroke-width="2"/>
    <text x="80" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FFF">📥 RECEIVE EXPLANATION</text>
    <text x="80" y="38" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#A8D5BA">In Their Language</text>
  </g>
  
  <!-- FLOW ARROWS - Main forward flow -->
  <g stroke="#FFD23F" stroke-width="2.5" fill="none" marker-end="url(#flow-arrow)" filter="url(#pulse)">
    <!-- 1. Patient → App -->
    <path d="M180 95 V135 H370 V185"/>
    <!-- 2. App → Core -->
    <path d="M370 185 V225 H580 V275"/>
    <!-- 3. Core → Conv -->
    <path d="M580 300 V315 H580 V365"/>
    <!-- 4. Conv → AI -->
    <path d="M580 390 V405 H580 V455"/>
  </g>
  
  <!-- RETURN FLOW - AI → Conv → App → Patient correction loop -->
  <g stroke="#8B2D6B" stroke-width="2" fill="none" marker-end="url(#return-arrow)" stroke-dasharray="6,4" opacity="0.8">
    <!-- AI → Conv (response) -->
    <path d="M580 430 V400"/>
    <!-- Conv → App (confirm) -->
    <path d="M480 365 H370 V365"/>
    <!-- App → Patient (show) -->
    <path d="M280 365 H180 V275"/>
    <!-- Patient → App (correct) -->
    <path d="M180 300 H280 V275"/>
    <!-- App → Core (submit) -->
    <path d="M370 275 H480 V275"/>
    <!-- Core → Conv (next question) -->
    <path d="M580 275 V300 H580 V340"/>
    <!-- Loop back to AI -->
    <path d="M580 365 V390 H580 V430" stroke="#FFD23F" stroke-dasharray="none" marker-end="url(#flow-arrow)"/>
  </g>
  
  <!-- DOCTOR PATH -->
  <g stroke="#FF6B35" stroke-width="2.5" fill="none" marker-end="url(#flow-arrow)">
    <!-- Core → Doctor -->
    <path d="M680 185 H730"/>
    <!-- Doctor → Record -->
    <path d="M730 185 V100 H580 V95"/>
    <!-- Record → Patient -->
    <path d="M580 100 V125 H180 V95"/>
  </g>
  
  <!-- STEP NUMBERS -->
  <g font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFD23F" text-anchor="middle">
    <circle cx="180" cy="95" r="12" fill="#0A0A12" stroke="#FFD23F" stroke-width="2"/>
    <text x="180" y="101">1</text>
    <circle cx="370" cy="185" r="12" fill="#0A0A12" stroke="#FFD23F" stroke-width="2"/>
    <text x="370" y="191">2</text>
    <circle cx="580" cy="275" r="12" fill="#0A0A12" stroke="#FFD23F" stroke-width="2"/>
    <text x="580" y="281">3</text>
    <circle cx="580" cy="365" r="12" fill="#0A0A12" stroke="#8B2D6B" stroke-width="2"/>
    <text x="580" y="371">4</text>
    <circle cx="580" cy="455" r="12" fill="#0A0A12" stroke="#8B2D6B" stroke-width="2"/>
    <text x="580" y="461">5</text>
    <circle cx="370" cy="365" r="12" fill="#0A0A12" stroke="#8B2D6B" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="370" y="371">6</text>
    <circle cx="180" cy="275" r="12" fill="#0A0A12" stroke="#FFD23F" stroke-width="2"/>
    <text x="180" y="281">7</text>
    <circle cx="370" cy="275" r="12" fill="#0A0A12" stroke="#FFD23F" stroke-width="2"/>
    <text x="370" y="281">8</text>
    <circle cx="580" cy="185" r="12" fill="#0A0A12" stroke="#FF6B35" stroke-width="2"/>
    <text x="580" y="191">9</text>
    <circle cx="730" cy="185" r="12" fill="#0A0A12" stroke="#FF6B35" stroke-width="2"/>
    <text x="730" y="191">10</text>
    <circle cx="580" cy="95" r="12" fill="#0A0A12" stroke="#147A5E" stroke-width="2"/>
    <text x="580" y="101">11</text>
    <circle cx="180" cy="95" r="12" fill="#0A0A12" stroke="#147A5E" stroke-width="2"/>
    <text x="180" y="101">12</text>
  </g>
  
  <!-- KEY INSIGHTS BOX -->
  <g transform="translate(50, 480)">
    <rect width="700" height="15" rx="4" fill="#0A0A12" stroke="#2A3A5E" stroke-width="1"/>
    <g font-family="system-ui, sans-serif" font-size="9" fill="#888">
      <text x="20" y="11">🔒 </text>
      <text x="35" y="11" font-weight="600" fill="#FFD23F">Provenance Tracked:</text>
      <text x="155" y="11">Every assertion stores source utterance, speaker, time, model version, confidence, patient & clinician corrections</text>
      <text x="580" y="11">🛡️ </text>
      <text x="595" y="11" font-weight="600" fill="#FF6B35">Safety Gate:</text>
      <text x="675" y="11">No AI draft enters signed record without clinician approval</text>
    </g>
  </g>
</svg>